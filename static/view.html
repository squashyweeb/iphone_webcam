<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>iPhone Webcam - Zero Latency P2P Receiver</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0a0a0c; color: #fff; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .container { position: relative; width: 95vw; height: 90vh; display: flex; align-items: center; justify-content: center; background: #000; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        video { width: 100%; height: 100%; object-fit: contain; }
        .status-overlay { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.65); backdrop-filter: blur(10px); padding: 10px 18px; border-radius: 20px; font-size: 14px; display: flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,0.1); z-index: 10; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: #ff5252; }
        .dot.live { background: #00e676; box-shadow: 0 0 10px #00e676; }
        button { position: absolute; bottom: 20px; padding: 10px 20px; background: rgba(41,121,255,0.8); color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; backdrop-filter: blur(5px); z-index: 10; }
    </style>
</head>
<body>
    <div class="container">
        <div class="status-overlay">
            <div id="dot" class="dot"></div>
            <span id="statusText">Waiting for iPhone camera...</span>
        </div>
        <video id="remoteVideo" autoplay playsinline controls></video>
        <button onclick="startP2P()">🔄 Retry Connection</button>
    </div>
    <script>
        const statusText = document.getElementById("statusText");
        const dot = document.getElementById("dot");
        const video = document.getElementById("remoteVideo");
        let pc = null;
        let ws = null;
        let p2pInterval = null;

        function startP2P() {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            console.log("[P2P] Starting P2P handshake...");
            statusText.innerText = "Connecting to iPhone camera...";

            if (pc) { pc.close(); pc = null; }
            pc = new RTCPeerConnection({ iceServers: [{ urls: "stun:stun.l.google.com:19302" }] });

            pc.addTransceiver("video", { direction: "recvonly" });

            pc.ontrack = (event) => {
                console.log("[P2P] Video track received!", event.track);
                video.srcObject = event.streams[0] || new MediaStream([event.track]);
                
                if ('playoutDelayHint' in video) {
                    video.playoutDelayHint = 0;
                }
                
                dot.classList.add("live");
                statusText.innerText = "⚡ DIRECT P2P LIVE (Zero-Lag LAN WebRTC)";
                if (p2pInterval) { clearInterval(p2pInterval); p2pInterval = null; }
            };

            pc.onicecandidate = ({ candidate }) => {
                if (candidate && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: "candidate", candidate }));
                }
            };

            pc.oniceconnectionstatechange = () => {
                console.log("[P2P] ICE state:", pc.iceConnectionState);
                if (pc.iceConnectionState === "disconnected" || pc.iceConnectionState === "failed") {
                    dot.classList.remove("live");
                    statusText.innerText = "Connection lost. Retrying...";
                    startAutoRetry();
                }
            };

            pc.createOffer().then(offer => {
                pc.setLocalDescription(offer);
                ws.send(JSON.stringify({ type: "offer", sdp: offer }));
            });
        }

        function startAutoRetry() {
            if (!p2pInterval) {
                p2pInterval = setInterval(() => {
                    if (!pc || (pc.iceConnectionState !== "connected" && pc.iceConnectionState !== "completed")) {
                        console.log("[P2P] Auto-retrying P2P handshake...");
                        startP2P();
                    }
                }, 3000);
            }
        }

        function connectWS() {
            ws = new WebSocket("wss://" + location.host + "/ws?role=viewer");

            ws.onopen = () => {
                statusText.innerText = "Connected to server. Waiting for iPhone...";
                startP2P();
                startAutoRetry();
            };

            ws.onmessage = async (event) => {
                const msg = JSON.parse(event.data);

                if (msg.type === "sender_online") {
                    console.log("[P2P] iPhone came online!");
                    startP2P();
                } else if (msg.type === "answer" && pc) {
                    console.log("[P2P] Answer received from iPhone");
                    await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
                } else if (msg.type === "candidate" && pc) {
                    try {
                        await pc.addIceCandidate(new RTCIceCandidate(msg.candidate));
                    } catch(e) {}
                }
            };

            ws.onclose = () => {
                dot.classList.remove("live");
                statusText.innerText = "Disconnected from server. Reconnecting...";
                if (p2pInterval) { clearInterval(p2pInterval); p2pInterval = null; }
                setTimeout(connectWS, 2000);
            };
        }

        connectWS();
    </script>
</body>
</html>
