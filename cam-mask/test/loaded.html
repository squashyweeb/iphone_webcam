<!doctype html>
<meta charset="utf-8" />
<title>loaded</title>
<body>
<pre id="out">pending</pre>
<script>
  // does NOT include inject.js: everything here must come from the installed extension
  setTimeout(async () => {
    const el = document.getElementById('out');
    const has = typeof window.__camMask;
    let devices = 'n/a';
    try {
      const d = await navigator.mediaDevices.enumerateDevices();
      devices = d.filter((x) => x.kind === 'videoinput').map((x) => x.label || '(blank)');
    } catch (e) {
      devices = 'ERR ' + e.message;
    }
    el.textContent =
      'RESULT extension handle: ' + has + '\nvideoinputs: ' + JSON.stringify(devices);
  }, 1200);
</script>
</body>
